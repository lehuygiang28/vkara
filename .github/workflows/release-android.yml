name: Release Android TV shell

on:
    push:
        tags:
            - 'android-v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Sync Leanback assets
              run: bun run --cwd apps/android-tv sync:assets

            # Leave VKARA_TV_URL unset — bake package.json vkara.defaultTvUrl for official releases.
            - name: Contract checks (default URL)
              run: bun run check:android-tv

            - name: Gate tag semver
              run: |
                  set -euo pipefail
                  TAG="${GITHUB_REF_NAME}"
                  EXPECTED="${TAG#android-v}"
                  PKG_VER="$(node -p "require('./apps/android-tv/package.json').version")"
                  echo "tag=$TAG expected=$EXPECTED apps/android-tv=$PKG_VER"
                  if [[ "$EXPECTED" != "$PKG_VER" ]]; then
                    echo "error: tag semver must match apps/android-tv package.json version" >&2
                    exit 1
                  fi

            - name: EAS production APK
              working-directory: apps/android-tv
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EXPO_TV: '1'
              run: bunx eas-cli build --platform android --profile production --non-interactive --wait --json > /tmp/eas-build.json

            - name: Download APK + package release assets
              working-directory: apps/android-tv
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: |
                  set -euo pipefail
                  URL="$(node -p "const j=require('/tmp/eas-build.json'); const b=Array.isArray(j)?j[0]:j; b.artifacts?.buildUrl || b.artifact?.url || ''")"
                  if [[ -z "$URL" ]]; then
                    echo "error: could not resolve EAS artifact URL from build JSON" >&2
                    cat /tmp/eas-build.json >&2 || true
                    exit 1
                  fi
                  mkdir -p dist
                  curl -L --fail "$URL" -o dist/eas-download.apk
                  bash scripts/package-release.sh dist/eas-download.apk

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  VER="${GITHUB_REF_NAME#android-v}"
                  DEFAULT_URL="$(node -p "require('./apps/android-tv/package.json').vkara.defaultTvUrl")"
                  NOTES="$(mktemp)"
                  cat > "$NOTES" <<EOF
                  ## vKara Android TV shell ${VER}

                  - Handoff URL: \`${DEFAULT_URL}\` (\`vkara.defaultTvUrl\`; CI leaves \`VKARA_TV_URL\` unset)
                  - applicationId: \`app.vkara.tv\`
                  - Install: Downloader / \`adb install -r\` (sideload; not Play Store)

                  ### Assets
                  - \`vKara-tv-${VER}.apk\`
                  - \`vKara-tv-${VER}.apk.sha256\`
                  EOF
                  gh release create "$GITHUB_REF_NAME" \
                    "apps/android-tv/dist/vKara-tv-${VER}.apk" \
                    "apps/android-tv/dist/vKara-tv-${VER}.apk.sha256" \
                    --title "vKara Android TV shell ${VER}" \
                    --notes-file "$NOTES"
