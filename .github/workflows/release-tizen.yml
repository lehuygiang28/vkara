name: Release Tizen shell

on:
    push:
        tags:
            - 'tizen-v*'

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Setup Node (npm publish + provenance)
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Install zip
              run: sudo apt-get update && sudo apt-get install -y zip

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Leave VKARA_TV_URL unset — bake package.json vkara.defaultTvUrl for official releases.
            - name: Build WGT + TizenBrew pack
              run: bun run build:tizen

            - name: Gate tag semver, baked default URL, no placeholder
              run: |
                  set -euo pipefail
                  TAG="${GITHUB_REF_NAME}"
                  EXPECTED="${TAG#tizen-v}"
                  PKG_VER="$(node -p "require('./apps/tizen/package.json').version")"
                  DEFAULT_URL="$(node -p "require('./apps/tizen/package.json').vkara.defaultTvUrl")"
                  BREW_VER="$(node -p "require('./apps/tizen/dist/tizenbrew/package.json').version")"
                  echo "tag=$TAG expected=$EXPECTED apps/tizen=$PKG_VER dist/tizenbrew=$BREW_VER defaultTvUrl=$DEFAULT_URL"
                  if [[ "$EXPECTED" != "$PKG_VER" || "$EXPECTED" != "$BREW_VER" ]]; then
                    echo "error: tag semver must match apps/tizen and dist/tizenbrew package.json versions" >&2
                    exit 1
                  fi
                  if [[ "$(node -p "require('./apps/tizen/dist/tizenbrew/package.json').name")" != "@vkara/tv" ]]; then
                    echo "error: publish package name must be @vkara/tv" >&2
                    exit 1
                  fi
                  python3 - "$DEFAULT_URL" <<'PY'
                  import json, re, sys
                  expected = sys.argv[1]
                  for path in (
                      "apps/tizen/dist/stage/js/main.js",
                      "apps/tizen/dist/tizenbrew/js/main.js",
                  ):
                      text = open(path, encoding="utf-8").read()
                      if "__VKARA_TV_URL__" in text:
                          raise SystemExit(f"error: placeholder leaked into {path}")
                      m = re.search(r"var APP_URL = (.+);", text)
                      if not m or json.loads(m.group(1)) != expected:
                          raise SystemExit(f"error: baked APP_URL mismatch in {path}")
                  print("baked APP_URL: OK")
                  PY
                  TGZ=(apps/tizen/dist/vkara-tv-*.tgz)
                  if [[ ! -f "${TGZ[0]}" ]]; then
                    echo "error: missing packed tarball apps/tizen/dist/vkara-tv-<version>.tgz" >&2
                    exit 1
                  fi

            - name: Publish @vkara/tv with provenance
              working-directory: apps/tizen/dist/tizenbrew
              run: npm publish --access public --provenance

            - name: Create GitHub Release with WGT
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  TAG="${GITHUB_REF_NAME}"
                  VER="${TAG#tizen-v}"
                  DEFAULT_URL="$(node -p "require('./apps/tizen/package.json').vkara.defaultTvUrl")"
                  REQUIRED_VER="$(
                    python3 -c "import re; t=open('apps/tizen/src/config.xml',encoding='utf-8').read(); m=re.search(r'required_version=\"([^\"]+)\"', t); print(m.group(1) if m else '?')"
                  )"
                  TGZ=(apps/tizen/dist/vkara-tv-*.tgz)
                  NOTES_FILE="$(mktemp)"
                  # Keep EOF unindented so the release markdown is not space-prefixed.
                  cat >"$NOTES_FILE" <<EOF
                  ## vKara Samsung TV shell ${VER}

                  Thin local launcher for Samsung Tizen TVs. Hands off top-level to the hosted \`/tv\` karaoke app — the UI is **not** bundled in this package.

                  ### Artifacts

                  | Artifact | Channel | Use |
                  |----------|---------|-----|
                  | \`@vkara/tv@${VER}\` | [npm](https://npm.im/@vkara/tv) / TizenBrew Module Manager | Primary install |
                  | \`vKara.wgt\` | This release (Apps2Samsung) | Sideload fallback if jsDelivr fails |
                  | \`vkara-tv-${VER}.tgz\` | This release | Packed npm tarball (optional local inspect) |

                  ### Baked configuration

                  - Handoff URL: \`${DEFAULT_URL}\` (\`vkara.defaultTvUrl\`; CI leaves \`VKARA_TV_URL\` unset)
                  - WGT package id: \`VkaraApp01\` / app id \`VkaraApp01.vkara\` (stable across upgrades)

                  ### Compatibility

                  - Platform floor: **Tizen ${REQUIRED_VER}+** (2021+ models; ~Chrome 76 on 6.0)
                  - Hosted \`/tv\` engine downlevel ships via **web deploy** — not this shell tag

                  ### Install

                  1. [TizenBrew](https://github.com/reisxd/TizenBrew) → Module Manager → add \`@vkara/tv\`
                  2. Or sideload \`vKara.wgt\` with [Apps2Samsung](https://github.com/Apps2Samsung/Apps2Samsung)

                  ### When to upgrade the shell

                  Republish only if the wrapper, media keys, splash/offline UI, privileges, or baked default URL changes. Routine \`/tv\` fixes do **not** need a new \`tizen-v*\` tag.
                  EOF
                  python3 - "$NOTES_FILE" <<'PY'
                  import pathlib, sys, textwrap
                  path = pathlib.Path(sys.argv[1])
                  path.write_text(textwrap.dedent(path.read_text(encoding="utf-8")).strip() + "\n", encoding="utf-8")
                  PY
                  gh release create "$TAG" \
                    --title "vKara TV shell ${VER}" \
                    --notes-file "$NOTES_FILE" \
                    apps/tizen/dist/vKara.wgt \
                    "${TGZ[@]}"
