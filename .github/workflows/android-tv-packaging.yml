name: Android TV packaging

on:
    pull_request:
        paths:
            - 'apps/android-tv/**'
            - 'package.json'
            - '.github/workflows/android-tv-packaging.yml'
            - '.github/workflows/release-android.yml'
    push:
        branches:
            - main
            - dev
        paths:
            - 'apps/android-tv/**'
            - 'package.json'
            - '.github/workflows/android-tv-packaging.yml'
            - '.github/workflows/release-android.yml'

concurrency:
    group: android-tv-packaging-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Sync Leanback assets
              run: bun run --cwd apps/android-tv sync:assets

            - name: Contract checks (default URL bake)
              run: bun run check:android-tv

            - name: Override bake smoke
              run: |
                  set -euo pipefail
                  VKARA_TV_URL='https://example.com/tv' bun run check:android-tv

            # Optional EAS preview (cost): enable when EXPO_TOKEN is configured on the repo.
            # - name: EAS preview APK
            #   if: ${{ secrets.EXPO_TOKEN != '' }}
            #   working-directory: apps/android-tv
